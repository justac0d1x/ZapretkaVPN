name: Сheck nodes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r checker/requirements.txt

      - name: Install Xray Core
        shell: bash
        env:
          XRAY_VERSION: ${{ vars.XRAY_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${XRAY_VERSION:-}" ] || [ "${XRAY_VERSION:-}" = "latest" ]; then
            URL=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
              | jq -r '.assets[] | select(.name | test("Xray-linux-64.zip$")) | .browser_download_url' | head -n 1)
          else
            URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          fi
          echo "Downloading $URL"
          curl -fsSL "$URL" -o /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo install -m 755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Install sing-box (for Hysteria2)
        shell: bash
        run: |
          set -euo pipefail
          SB_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          echo "Installing sing-box $SB_VERSION"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/${SB_VERSION}/sing-box-${SB_VERSION#v}-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Check nodes
        env:
          # Имя ноды в отчёте, можно поменять в Settings -> Variables
          NODE_NAME: ${{ vars.NODE_NAME || 'Zapretka' }}
          TEST_URL: ${{ vars.TEST_URL || 'https://www.gstatic.com/generate_204' }}
          TIMEOUT_SECONDS: ${{ vars.TIMEOUT_SECONDS || '12' }}
          USER_AGENT: ${{ vars.USER_AGENT || 'HiddifyNext/2.0.5' }}
          SUBSCRIPTION_ACCEPT: ${{ vars.SUBSCRIPTION_ACCEPT || '*/*' }}
          FETCH_RETRIES: ${{ vars.FETCH_RETRIES || '4' }}
          NODE_URIS: ${{ secrets.NODE_URIS }}
          NODE_URLS: ${{ secrets.NODE_URLS }}
          PROXY_URI: ${{ secrets.PROXY_URI }}
        run: |
          python checker/checker.py \
            --concurrency 12 \
            --input nodes.txt \
            --output output/sub.txt \
            --report output/report.md \
            --test-url "$TEST_URL" \
            --timeout "$TIMEOUT_SECONDS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-check-results
          path: output/*

      - name: Commit and push output files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update subscription $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
